    <style>
        * {

        body {
            background: #0a0a0a;

            direction: ltr; /* للحفاظ على أرقام الحلقات والسيرفرات مرتبة بشكل صحيح */

        header {
            background: #0f0f0f;

        .header-container {

        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;

            color: #e50914;
        }
        
        .logo span {

        .back-link {
            color: #fff;

            background: #1a1a1a;

            max-width: 1400px;

            position: relative;

        .player-container iframe {
            width: 100%;

            border: none;
        }
        
        .player-loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            z-index: 10;

        .loading-spinner {
            width: 40px;

            border: 3px solid #1a1a1a;
            border-top-color: #e50914;

        @keyframes spin {

        }
        
        .servers-bar {
            background: #0f0f0f;
            border-radius: 12px;

        .servers-header {
            display: flex;

        .servers-grid {
            display: flex;

        .server-btn {
            background: #1a1a1a;
            border: none;

            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;

        .server-btn:hover {
            background: #2a2a2a;

        .server-btn.active {

        /* --- الأقسام الجديدة الخاصة بالحلقات والمواسم بنفس تصميم الموقع --- */

            font-weight: bold;
            margin-bottom: 14px;

            gap: 8px;
        }

        .section-label span {
            width: 4px;

            border-radius: 2px;
            display: inline-block;
        }

        .season-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;

        .season-tab {
            padding: 8px 20px;

            background: #1a1a1a;

        }

        .episodes-grid {
            display: grid;

        .ep-btn {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            background: #1a1a1a;

        .movie-info {

        .meta {

            color: #aaa;
            line-height: 1.6;

        .cast-section, .similar-section {

        .cast-section h3, .similar-section h3 {
            margin-bottom: 16px;

        }
        
        .cast-scroll {
            display: flex;
            overflow-x: auto;

            padding-bottom: 8px;

        .cast-card {
            flex-shrink: 0;

        .cast-card img {

        .cast-card .name {

        .cast-card .char {

        .similar-grid {

            gap: 16px;

        .movie-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;

        .movie-card:hover {

        .movie-card img {

        .movie-card .info {

        .movie-card .title {

        .error {

        footer {

    <script>
        const API_KEY = '581842026857dccc1762ce91bff8f0aa';
        const BASE = 'https://api.themoviedb.org/3';
        const IMG = 'https://image.tmdb.org/t/p/w185';
        const ADULT_KEYWORDS = ['hentai', 'ecchi', 'porn', 'xxx', 'sex', 'nsfw', 'uncensored', 'erotic', '18+'];
        
        // سيرفرات الأفلام العادية
        const MOVIE_SERVERS = [
            { name: '🚀 StreamIMDb', needs: 'imdb', url: ({ imdb }) => `https://streamimdb.ru/embed/movie/${imdb}` },
            { name: '🎞️ VidAPI', needs: 'tmdb', url: ({ tmdb, title }) => `https://vaplayer.ru/embed/movie/${tmdb}?primaryColor=%23e50914&title=${encodeURIComponent(title || '27AFLAM')}` },
            { name: '📺 2Embed', needs: 'imdb', url: ({ imdb }) => `https://www.2embed.cc/embed/${imdb}` },
            { name: '🎬 EmbedStream', needs: 'imdb', url: ({ imdb }) => `https://embedstream.com/movie/imdb/${imdb}` },
            { name: '🍿 Movies2Watch', needs: 'imdb', url: ({ imdb }) => `https://movies2watch.cc/embed/movie/${imdb}` }
        ];

        const TV_SERVERS = [
            { name: '🚀 StreamIMDb', url: ({ tmdb, season, episode }) => `https://streamimdb.ru/embed/tv/${tmdb}/${season}/${episode}` },
            { name: '🎞️ VidAPI', url: ({ tmdb, season, episode, title }) => `https://vaplayer.ru/embed/tv/${tmdb}/${season}/${episode}?primaryColor=%23e50914&title=${encodeURIComponent(title || '27AFLAM')}` }
        ];
        
        let currentImdbId = null;
        let currentTmdbId = null;
        let contentType = 'movie'; // استقبال النوع من الرابط (movie أو tv أو anime)
        let currentSeason = 1;
        let currentEpisode = 1;
        let totalSeasons = 1;
        let currentServerIndex = 0;
        let currentTitle = '';

        // Server health tracking
        const SERVER_HEALTH = { failures: {}, lastCheck: 0 };
        const PLAYER_LOAD_TIMEOUT = 15000;
        let playerLoadTimer = null;

        function reportServerFailure(serverName) {
            SERVER_HEALTH.failures[serverName] = (SERVER_HEALTH.failures[serverName] || 0) + 1;
            logPlayerFailure(serverName, SERVER_HEALTH.failures[serverName]);
        }

        function logPlayerFailure(serverName, failureCount) {
            const entry = {
                timestamp: new Date().toISOString(),
                context: 'player_load_failure',
                server: serverName,
                failureCount
            };
            console.warn('[27AFLAM PLAYER]', entry);
            try {
                const logs = JSON.parse(localStorage.getItem('27aflam_logs') || '[]');
                logs.push(entry);
                if (logs.length > 100) logs.splice(0, 50);
                localStorage.setItem('27aflam_logs', JSON.stringify(logs));
            } catch {}
        }

        function findNextHealthyServer(currentIndex, servers) {
            for (let i = 0; i < servers.length; i++) {
                if (i === currentIndex) continue;
                const failures = SERVER_HEALTH.failures[servers[i].name] || 0;
                if (failures < 3) return i;
            }
            return -1;
        }

        function setupPlayerHealth() {
            const player = document.getElementById('player');
            const loadEl = document.getElementById('player-loading');

            player.addEventListener('load', () => {
                clearTimeout(playerLoadTimer);
                loadEl.style.display = 'none';
            });

            player.addEventListener('error', () => {
                handlePlayerError();
            });

            // Timeout detection
            playerLoadTimer = setTimeout(() => {
                if (loadEl.style.display !== 'none') {
                    handlePlayerError();
                }
            }, PLAYER_LOAD_TIMEOUT);
        }

        function handlePlayerError() {
            const servers = contentType === 'movie' ? MOVIE_SERVERS : TV_SERVERS;
            const currentServer = servers[currentServerIndex];
            if (!currentServer) return;

            reportServerFailure(currentServer.name);
            const failures = SERVER_HEALTH.failures[currentServer.name];

            if (failures >= 2) {
                const nextServer = findNextHealthyServer(currentServerIndex, servers);
                if (nextServer >= 0) {
                    document.getElementById('server-status').textContent = `⚠️ ${currentServer.name} slow, switching...`;
                    document.getElementById('server-status').style.color = '#ff9800';
                    setTimeout(() => {
                        switchServer(nextServer);
                    }, 1500);
                    return;
                }
            }

            document.getElementById('player-loading').innerHTML = `
                <p class="error">Stream unavailable. Try another server.</p>
                <p style="font-size:12px;color:#888;margin-top:8px;">${currentServer.name} is experiencing issues.</p>
            `;
            document.getElementById('server-status').textContent = `❌ ${currentServer.name} failed`;
            document.getElementById('server-status').style.color = '#f44336';
        }

        function addAdultFilter(url) {
            const u = new URL(url);
            u.searchParams.set('include_adult', 'false');
            return u.toString();
        }

        function isBlockedContent(item) {
            if (!item) return true;
            if (item.adult === true) return true;
            const text = `${item.title || ''} ${item.name || ''} ${item.original_title || ''} ${item.original_name || ''} ${item.overview || ''}`.toLowerCase();
            return ADULT_KEYWORDS.some(k => text.includes(k));
        }

        function blockContent() {
            document.getElementById('player').src = '';
            document.getElementById('servers-container').style.display = 'none';
            document.getElementById('episodes-container').style.display = 'none';
            document.getElementById('cast-section').style.display = 'none';
            document.getElementById('movie-title').textContent = 'Content blocked';
            document.getElementById('movie-overview').textContent = 'This title was blocked by adult-content filter.';
            document.getElementById('player-loading').innerHTML = '<p class="error">Adult content blocked.</p>';
        }

        function setMeta(name, content, property = false) {
            const selector = property ? `meta[property="${name}"]` : `meta[name="${name}"]`;
            let tag = document.querySelector(selector);
            if (!tag) {
                tag = document.createElement('meta');
                tag.setAttribute(property ? 'property' : 'name', name);
                document.head.appendChild(tag);
            }
            tag.setAttribute('content', content);
        }

        function updateDocumentSeo(item) {
            const title = item.title || item.name || 'Watch Online';
            const description = item.overview || `Watch ${title} online on 27AFLAM.`;
            document.title = `${title} - Watch Online | 27AFLAM`;
            setMeta('description', description);
            setMeta('og:title', `${title} - Watch Online | 27AFLAM`, true);
            setMeta('og:description', description, true);
            if (item.poster_path) setMeta('og:image', `${IMG}${item.poster_path}`, true);

            // Structured data: Movie or TVSeries
            const isTV = item.first_air_date || item.number_of_seasons;
            const schemaType = isTV ? 'TVSeries' : 'Movie';
            const schema = {
                "@context": "https://schema.org",
                "@type": schemaType,
                "name": title,
                "description": description,
                "image": item.poster_path ? `https://image.tmdb.org/t/p/w780${item.poster_path}` : undefined,
                "datePublished": item.release_date || item.first_air_date || undefined,
                "aggregateRating": item.vote_average ? {
                    "@type": "AggregateRating",
                    "ratingValue": item.vote_average.toFixed(1),
                    "bestRating": "10",
                    "worstRating": "1",
                    "ratingCount": item.vote_count || 0
                } : undefined,
                "genre": item.genres?.map(g => g.name) || undefined
            };
            if (isTV) {
                schema.numberOfSeasons = item.number_of_seasons || undefined;
                schema.numberOfEpisodes = item.number_of_episodes || undefined;
            } else if (item.runtime) {
                schema.duration = `PT${item.runtime}M`;
            }

            // BreadcrumbList
            const breadcrumb = {
                "@context": "https://schema.org",
                "@type": "BreadcrumbList",
                "itemListElement": [
                    { "@type": "ListItem", "position": 1, "name": "27AFLAM", "item": "https://27aflam.com/" },
                    { "@type": "ListItem", "position": 2, "name": isTV ? "Series" : "Movies", "item": `https://27aflam.com/` },
                    { "@type": "ListItem", "position": 3, "name": title }
                ]
            };

            // Remove existing structured data if any
            document.querySelectorAll('script[data-structured-data]').forEach(el => el.remove());

            const itemSchema = document.createElement('script');
            itemSchema.type = 'application/ld+json';
            itemSchema.setAttribute('data-structured-data', 'true');
            itemSchema.textContent = JSON.stringify({ "@graph": [schema, breadcrumb] });
            document.head.appendChild(itemSchema);
        }

        function escapeHTML(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function similarCardHTML(item, type) {
            const title = item.title || item.name || 'Untitled';
            const poster = item.poster_path ? IMG + item.poster_path : '';
            const year = (item.release_date || item.first_air_date || '').slice(0, 4);
            const href = type === 'movie'
                ? `watch.html?id=${item.id}&title=${encodeURIComponent(title)}`
                : `watch.html?id=${item.id}&type=tv&title=${encodeURIComponent(title)}`;
            return `
                <div class="movie-card" onclick="window.location.href='${href}'">
                    ${poster ? `<img src="${poster}" loading="lazy" alt="${escapeHTML(title)} poster">` : ''}
                    <div class="info">
                        <div class="title">${escapeHTML(title)}</div>
                        <div style="font-size:11px;color:#888;">${year}</div>
                    </div>
                </div>
            `;
        }

        async function loadSimilar(tmdbId, type) {
            try {
                const response = await fetch(addAdultFilter(`${BASE}/${type}/${tmdbId}/similar?api_key=${API_KEY}&page=1`));
                const data = await response.json();
                const items = (data.results || []).filter(item => !isBlockedContent(item)).slice(0, 12);
                if (!items.length) return;

                document.getElementById('similar-section').style.display = 'block';
                document.getElementById('similar-grid').innerHTML = items.map(item => similarCardHTML(item, type)).join('');
            } catch (error) {
                console.error('Error loading similar titles:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            currentTmdbId = params.get('id');
            const imdbId = params.get('imdb');
            contentType = params.get('type') || 'movie'; // استقبال النوع من الرابط (movie أو tv أو anime)
            
            const player = document.getElementById('player');
            const loadEl = document.getElementById('player-loading');
            
            setupPlayerHealth();
            
            if (!currentTmdbId && imdbId) {
                currentImdbId = imdbId;
            }

            if (contentType === 'movie') {
                // نظام تشغيل الأفلام العادي
                document.getElementById('episodes-container').style.display = 'none';
                if (imdbId) {
                    currentImdbId = imdbId;
                    renderMovieServers();
                    startMoviePlayer(0);
                    if (currentTmdbId) loadDetails(currentTmdbId, 'movie');
                } else if (currentTmdbId) {
                    fetchImdbAndPlay(currentTmdbId);
                }
            } else {
                // نظام تشغيل المسلسلات والأنمي (tv / anime)
                document.getElementById('servers-container').style.display = 'none'; // إخفاء سيرفرات الفيلم
                renderTvServers();
                document.getElementById('episodes-container').style.display = 'block'; // إظهار أزرار الحلقات
                if (currentTmdbId) {
                    loadTVShow(currentTmdbId);
                    loadDetails(currentTmdbId, 'tv');
                }
            }
        });
        
        // ─── وظائف الأفلام ───────────────────────────────────
        function renderMovieServers() {
            const container = document.getElementById('server-buttons');
            container.innerHTML = MOVIE_SERVERS.map((server, index) => `
                <button class="server-btn" data-index="${index}" onclick="switchServer(${index})">
                    ${server.name}
                </button>
            `).join('');
            markServerActive(0);
        }
        
        function markServerActive(index) {
            const btns = document.querySelectorAll('.server-btn');
            btns.forEach((btn, i) => btn.classList.toggle('active', i === index));
        }
        
        window.switchServer = function(index) {
            if (contentType === 'movie') {
                if (!MOVIE_SERVERS[index]) return;
                markServerActive(index);
                startMoviePlayer(index);
            } else {
                if (!TV_SERVERS[index]) return;
                markServerActive(index);
                currentServerIndex = index;
                playEpisode(currentEpisode);
            }
        };
        
        function startMoviePlayer(serverIndex = 0) {
            const server = MOVIE_SERVERS[serverIndex];
            if (!server) return;
            if (server.needs === 'imdb' && !currentImdbId) {
                document.getElementById('player-loading').innerHTML = '<p class="error">This server needs IMDb ID. Try VidAPI.</p>';
                return;
            }
            if (server.needs === 'tmdb' && !currentTmdbId) {
                document.getElementById('player-loading').innerHTML = '<p class="error">This server needs TMDB ID.</p>';
                return;
            }
            currentServerIndex = serverIndex;
            document.getElementById('server-status').textContent = `✅ ${server.name} active`;
            document.getElementById('player-loading').style.display = 'flex';
            document.getElementById('player').src = server.url({ imdb: currentImdbId, tmdb: currentTmdbId, title: currentTitle });
        }

        function renderTvServers() {
            document.getElementById('servers-container').style.display = 'block';
            document.getElementById('servers-title-label').textContent = '📺 Select Episode Server';
            const container = document.getElementById('server-buttons');
            container.innerHTML = TV_SERVERS.map((server, index) => `
                <button class="server-btn" data-index="${index}" onclick="switchServer(${index})">
                    ${server.name}
                </button>
            `).join('');
            markServerActive(0);
        }
        
        async function fetchImdbAndPlay(tmdbId) {
            try {
                const response = await fetch(addAdultFilter(`${BASE}/movie/${tmdbId}/external_ids?api_key=${API_KEY}`));
                const data = await response.json();
                if (data.imdb_id) {
                    currentImdbId = data.imdb_id;
                    renderMovieServers();
                    startMoviePlayer(0);
                    loadDetails(tmdbId, 'movie');
                } else {
                    renderMovieServers();
                    markServerActive(1);
                    startMoviePlayer(1);
                    loadDetails(tmdbId, 'movie');
                }
            } catch(error) {
                document.getElementById('player-loading').innerHTML = '<p class="error">❌ Failed to load.</p>';
            }
        }
        
        // ─── وظائف المسلسلات والأنمي ───────────────────────────
        async function loadTVShow(tmdbId) {
            try {
                const res = await fetch(addAdultFilter(`${BASE}/tv/${tmdbId}?api_key=${API_KEY}`));
                const data = await res.json();
                if (isBlockedContent(data)) return blockContent();
                totalSeasons = data.number_of_seasons || 1;
                
                buildSeasonTabs();
                await loadEpisodes(1);
            } catch (err) {
                console.error("Error loading show:", err);
            }
        }
        
        function buildSeasonTabs() {
            const container = document.getElementById("season-tabs");
            container.innerHTML = "";
            for (let s = 1; s <= totalSeasons; s++) {
                const btn = document.createElement("button");
                btn.className = "season-tab" + (s === 1 ? " active" : "");
                btn.textContent = `Season ${s}`;
                btn.onclick = () => selectSeason(s);
                container.appendChild(btn);
            }
        }
        
        async function selectSeason(s) {
            currentSeason = s;
            document.querySelectorAll(".season-tab").forEach((b, i) => b.classList.toggle("active", i + 1 === s));
            await loadEpisodes(s);
        }
        
        async function loadEpisodes(season) {
            const grid = document.getElementById("episodes-grid");
            grid.innerHTML = `<div style="color:#aaa; font-size:14px;">Loading episodes…</div>`;
            
            try {
                const res = await fetch(addAdultFilter(`${BASE}/tv/${currentTmdbId}/season/${season}?api_key=${API_KEY}`));
                const data = await res.json();
                const eps = (data.episodes || []).filter(e => e.episode_type !== "special");
                
                grid.innerHTML = "";
                eps.forEach(ep => {
                    const btn = document.createElement("button");
                    btn.className = "ep-btn" + (ep.episode_number === 1 && season === 1 ? " active" : "");
                    btn.textContent = ep.episode_number;
                    btn.onclick = () => playEpisode(ep.episode_number);
                    grid.appendChild(btn);
                });
                
                playEpisode(1); // تشغيل الحلقة الأولى تلقائياً عند تحميل الموسم
            } catch (err) {
                grid.innerHTML = `<div class="error">Failed to load episodes.</div>`;
            }
        }
        
        function playEpisode(ep) {
            currentEpisode = ep;
            document.querySelectorAll(".ep-btn").forEach(b => b.classList.toggle("active", parseInt(b.textContent) === ep));
            
            document.getElementById('player-loading').style.display = 'flex';
            const server = TV_SERVERS[currentServerIndex] || TV_SERVERS[0];
            document.getElementById('server-status').textContent = `✅ ${server.name} active`;
            document.getElementById("player").src = server.url({ tmdb: currentTmdbId, season: currentSeason, episode: ep, title: currentTitle });
        }

        // ─── جلب تفاصيل ومعلومات المحتوى ────────────────────────
        async function loadDetails(tmdbId, type) {
            try {
                const response = await fetch(addAdultFilter(`${BASE}/${type}/${tmdbId}?api_key=${API_KEY}`));
                const item = await response.json();
                if (isBlockedContent(item)) return blockContent();
                updateDocumentSeo(item);
                currentTitle = item.title || item.name || '';
                
                document.getElementById('movie-title').textContent = item.title || item.name;
                document.getElementById('movie-overview').textContent = item.overview || 'No description available.';
                document.getElementById('movie-rating').textContent = `⭐ ${item.vote_average?.toFixed(1) || 'N/A'}`;
                document.getElementById('movie-year').textContent = (item.release_date || item.first_air_date)?.slice(0, 4) || '';
                document.getElementById('movie-genre').textContent = item.genres?.map(g => g.name).join(', ') || '';
                
                if (item.runtime) {
                    document.getElementById('movie-runtime').textContent = `${Math.floor(item.runtime / 60)}h ${item.runtime % 60}m`;
                } else if (item.episode_run_time) {
                    document.getElementById('movie-runtime').textContent = `${item.episode_run_time[0] || ''}m per ep`;
                }
                
                // جلب الممثلين (Cast)
                const castResponse = await fetch(addAdultFilter(`${BASE}/${type}/${tmdbId}/credits?api_key=${API_KEY}`));
                const castData = await castResponse.json();
                const cast = (castData.cast || []).slice(0, 15);
                
                if (cast.length) {
                    document.getElementById('cast-section').style.display = 'block';
                    document.getElementById('cast-scroll').innerHTML = cast.map(c => {
                        const img = c.profile_path ? IMG + c.profile_path : '';
                        return `
                            <div class="cast-card">
                                ${img ? `<img src="${img}" loading="lazy">` : '<div style="width:120px;height:120px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center">🎭</div>'}
                                <div class="name">${c.name}</div>
                                <div class="char">${c.character || ''}</div>
                            </div>
                        `;
                    }).join('');
                }

                loadSimilar(tmdbId, type);
            } catch(error) {
                console.error('Error loading details:', error);
            }
        }
    </script>
</body>
</html>
