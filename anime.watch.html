<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Anime - 27AFLAM</title>
    <meta name="description" content="Watch anime episodes online on 27AFLAM with season and episode navigation plus anime cover filtering.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta property="og:type" content="video.tv_show">
    <meta property="og:site_name" content="27AFLAM">
    <meta property="og:title" content="Watch Anime Online - 27AFLAM">
    <meta property="og:description" content="Watch anime episodes online on 27AFLAM.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            direction: ltr;
        }
        
        header {
            background: #0f0f0f;
            padding: 16px 24px;
            border-bottom: 1px solid #1f1f1f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: #e50914;
        }
        
        .logo span {
            color: #fff;
        }
        
        .back-link {
            color: #fff;
            text-decoration: none;
            background: #1a1a1a;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.2s;
        }
        
        .back-link:hover {
            background: #e50914;
        }
        
        .watch-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .player-container {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            margin-bottom: 24px;
        }
        
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .player-loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .servers-bar {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 18px;
        }

        .servers-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .servers-label {
            font-size: 14px;
            color: #aaa;
            font-weight: 600;
        }

        .server-status {
            font-size: 12px;
            color: #4caf50;
        }

        .servers-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .server-btn {
            background: #1a1a1a;
            border: none;
            color: #fff;
            padding: 7px 13px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .server-btn:hover,
        .server-btn.active {
            background: #e50914;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1a1a1a;
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ─── قسم الحلقات والمواسم بنفس هوية الموقع ─── */
        .episodes-section {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label span {
            width: 4px;
            height: 18px;
            background: #e50914;
            border-radius: 2px;
            display: inline-block;
        }

        .season-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .season-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            background: #1a1a1a;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all .2s;
        }

        .season-tab.active, .season-tab:hover {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
        }

        .episodes-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.ep-btn {
    width: 50px; /* حجم ثابت وصغير للزر */
    height: 50px;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
    background: #1a1a1a;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

        .ep-btn:hover { background: #2a2a2a; }
        .ep-btn.active {
            background: #e50914;
            border-color: #e50914;
            color: #fff;
        }
        
        .movie-info {
            margin-bottom: 32px;
        }
        
        .movie-info h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }
        
        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
            color: #aaa;
            font-size: 14px;
        }
        
        .rating {
            color: #ffc107;
        }
        
        .movie-info p {
            color: #aaa;
            line-height: 1.6;
            max-width: 800px;
        }
        
        .cast-section, .similar-section {
            margin-top: 32px;
        }
        
        .cast-section h3, .similar-section h3 {
            margin-bottom: 16px;
            font-size: 20px;
        }
        
        .cast-scroll {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding-bottom: 8px;
        }
        
        .cast-card {
            flex-shrink: 0;
            width: 120px;
            text-align: center;
        }
        
        .cast-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #1a1a1a;
        }
        
        .cast-card .name {
            font-size: 13px;
            margin-top: 8px;
            font-weight: 500;
        }
        
        .cast-card .char {
            font-size: 11px;
            color: #888;
        }
        
        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }
        
        .movie-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .movie-card:hover {
            transform: translateY(-4px);
        }
        
        .movie-card img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
        }
        
        .movie-card .info {
            padding: 8px;
        }
        
        .movie-card .title {
            font-size: 13px;
            font-weight: 500;
        }
        
        .error {
            color: #e50914;
            text-align: center;
            padding: 20px;
        }
        
        footer {
            background: #0f0f0f;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 40px;
        }
        
        @media (max-width: 768px) {
            .watch-page { padding: 16px; }
            .movie-info h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">27<span>AFLAM</span></a>
            <a href="index.html" class="back-link">&larr; Back</a>
        </div>
    </header>

    <main class="watch-page">
        <div class="servers-bar" id="servers-container">
            <div class="servers-header">
                <span class="servers-label">🍜 Select Anime Server</span>
                <span class="server-status" id="server-status">✅ StreamIMDb active</span>
            </div>
            <div class="servers-grid" id="server-buttons"></div>
        </div>

        <div class="player-container">
            <div class="player-loading" id="player-loading">
                <div class="loading-spinner"></div>
                <span>Loading player...</span>
            </div>
            <iframe id="player" src="" frameborder="0" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="no-referrer"></iframe>
        </div>

        <div class="episodes-section" id="episodes-container">
            <div class="section-label"><span></span>Seasons</div>
            <div class="season-tabs" id="season-tabs"></div>
            
            <div class="section-label"><span></span>Episodes</div>
            <div class="episodes-grid" id="episodes-grid"></div>
        </div>
        
        <div class="movie-info" id="movie-info">
            <h1 id="movie-title">Loading...</h1>
            <div class="meta">
                <span id="movie-rating" class="rating"></span>
                <span id="movie-year"></span>
                <span id="movie-genre"></span>
                <span id="movie-runtime"></span>
            </div>
            <p id="movie-overview"></p>
        </div>
        
        <div class="cast-section" id="cast-section" style="display:none;">
            <h3>🎭 Cast</h3>
            <div class="cast-scroll" id="cast-scroll"></div>
        </div>
        
        <div class="similar-section" id="similar-section" style="display:none;">
            <h3>🎬 Similar Anime</h3>
            <div class="similar-grid" id="similar-grid"></div>
        </div>
    </main>

    <footer>
        <div class="footer-bottom"><p>27AFLAM &copy; 2026 - Powered by TMDB</p></div>
    </footer>

    <script>
        const API_KEY = '581842026857dccc1762ce91bff8f0aa';
        const BASE = 'https://api.themoviedb.org/3';
        const IMG = 'https://image.tmdb.org/t/p/w185';
        const ADULT_KEYWORDS = ['hentai', 'ecchi', 'porn', 'xxx', 'sex', 'nsfw', 'uncensored', 'erotic', '18+'];
        const TV_SERVERS = [
            { name: '🚀 StreamIMDb', url: ({ tmdb, season, episode }) => `https://streamimdb.ru/embed/tv/${tmdb}/${season}/${episode}` },
            { name: '🎞️ VidAPI', url: ({ tmdb, season, episode, title }) => `https://vaplayer.ru/embed/tv/${tmdb}/${season}/${episode}?primaryColor=%23e50914&title=${encodeURIComponent(title || '27AFLAM')}` }
        ];
        
        let currentTmdbId = null;
        let currentSeason = 1;
        let currentEpisode = 1;
        let totalSeasons = 1;
        let currentServerIndex = 0;
        let currentTitle = '';

        function addAdultFilter(url) {
            const u = new URL(url);
            u.searchParams.set('include_adult', 'false');
            return u.toString();
        }

        function isBlockedContent(item) {
            if (!item) return true;
            if (item.adult === true) return true;
            const text = `${item.title || ''} ${item.name || ''} ${item.original_title || ''} ${item.original_name || ''} ${item.overview || ''}`.toLowerCase();
            return ADULT_KEYWORDS.some(k => text.includes(k));
        }

        function blockContent() {
            document.getElementById('player').src = '';
            document.getElementById('episodes-container').style.display = 'none';
            document.getElementById('cast-section').style.display = 'none';
            document.getElementById('movie-title').textContent = 'Content blocked';
            document.getElementById('movie-overview').textContent = 'This title was blocked by adult-content filter.';
            document.getElementById('player-loading').innerHTML = '<p class="error">Adult content blocked.</p>';
        }

        function setMeta(name, content, property = false) {
            const selector = property ? `meta[property="${name}"]` : `meta[name="${name}"]`;
            let tag = document.querySelector(selector);
            if (!tag) {
                tag = document.createElement('meta');
                tag.setAttribute(property ? 'property' : 'name', name);
                document.head.appendChild(tag);
            }
            tag.setAttribute('content', content);
        }

        function updateDocumentSeo(item) {
            const title = item.name || 'Watch Anime';
            const description = item.overview || `Watch ${title} anime episodes online on 27AFLAM.`;
            document.title = `${title} - Watch Anime Online | 27AFLAM`;
            setMeta('description', description);
            setMeta('og:title', `${title} - Watch Anime Online | 27AFLAM`, true);
            setMeta('og:description', description, true);
            if (item.poster_path) setMeta('og:image', `${IMG}${item.poster_path}`, true);

            // TVSeries structured data + BreadcrumbList
            const schema = {
                "@context": "https://schema.org",
                "@type": "TVSeries",
                "name": title,
                "description": description,
                "image": item.poster_path ? `https://image.tmdb.org/t/p/w780${item.poster_path}` : undefined,
                "datePublished": item.first_air_date || undefined,
                "aggregateRating": item.vote_average ? {
                    "@type": "AggregateRating",
                    "ratingValue": item.vote_average.toFixed(1),
                    "bestRating": "10",
                    "worstRating": "1",
                    "ratingCount": item.vote_count || 0
                } : undefined,
                "genre": item.genres?.map(g => g.name) || undefined,
                "numberOfSeasons": item.number_of_seasons || undefined,
                "numberOfEpisodes": item.number_of_episodes || undefined
            };
            const breadcrumb = {
                "@context": "https://schema.org",
                "@type": "BreadcrumbList",
                "itemListElement": [
                    { "@type": "ListItem", "position": 1, "name": "27AFLAM", "item": "https://27aflam.com/" },
                    { "@type": "ListItem", "position": 2, "name": "Anime", "item": "https://27aflam.com/" },
                    { "@type": "ListItem", "position": 3, "name": title }
                ]
            };
            document.querySelectorAll('script[data-structured-data]').forEach(el => el.remove());
            const itemSchema = document.createElement('script');
            itemSchema.type = 'application/ld+json';
            itemSchema.setAttribute('data-structured-data', 'true');
            itemSchema.textContent = JSON.stringify({ "@graph": [schema, breadcrumb] });
            document.head.appendChild(itemSchema);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            currentTmdbId = params.get('id');
            
            const player = document.getElementById('player');
            const loadEl = document.getElementById('player-loading');
            
            player.addEventListener('load', () => {
                loadEl.style.display = 'none';
            });
            
            if (currentTmdbId) {
                renderServers();
                loadAnime(currentTmdbId);
                loadDetails(currentTmdbId);
            } else {
                document.getElementById('movie-title').textContent = "Anime not found";
            }
        });

        function renderServers() {
            const container = document.getElementById('server-buttons');
            container.innerHTML = TV_SERVERS.map((server, index) => `
                <button class="server-btn" data-index="${index}" onclick="switchServer(${index})">
                    ${server.name}
                </button>
            `).join('');
            markServerActive(0);
        }

        function markServerActive(index) {
            document.querySelectorAll('.server-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
        }

        window.switchServer = function(index) {
            if (!TV_SERVERS[index]) return;
            currentServerIndex = index;
            markServerActive(index);
            playEpisode(currentEpisode);
        };
        
        async function loadAnime(tmdbId) {
            try {
                const res = await fetch(addAdultFilter(`${BASE}/tv/${tmdbId}?api_key=${API_KEY}`));
                const data = await res.json();
                if (isBlockedContent(data)) return blockContent();
                totalSeasons = data.number_of_seasons || 1;
                
                buildSeasonTabs();
                await loadEpisodes(1);
            } catch (err) {
                console.error("Error loading anime:", err);
            }
        }
        
        function buildSeasonTabs() {
            const container = document.getElementById("season-tabs");
            container.innerHTML = "";
            for (let s = 1; s <= totalSeasons; s++) {
                const btn = document.createElement("button");
                btn.className = "season-tab" + (s === 1 ? " active" : "");
                btn.textContent = `Season ${s}`;
                btn.onclick = () => selectSeason(s);
                container.appendChild(btn);
            }
        }
        
        async function selectSeason(s) {
            currentSeason = s;
            document.querySelectorAll(".season-tab").forEach((b, i) => b.classList.toggle("active", i + 1 === s));
            await loadEpisodes(s);
        }
        
        async function loadEpisodes(season) {
            const grid = document.getElementById("episodes-grid");
            grid.innerHTML = `<div style="color:#aaa; font-size:14px;">Loading episodes…</div>`;
            
            try {
                const res = await fetch(addAdultFilter(`${BASE}/tv/${currentTmdbId}/season/${season}?api_key=${API_KEY}`));
                const data = await res.json();
                const eps = (data.episodes || []).filter(e => e.episode_type !== "special");
                
                grid.innerHTML = "";
                eps.forEach(ep => {
                    const btn = document.createElement("button");
                    btn.className = "ep-btn" + (ep.episode_number === 1 && season === 1 ? " active" : "");
                    btn.textContent = ep.episode_number;
                    btn.onclick = () => playEpisode(ep.episode_number);
                    grid.appendChild(btn);
                });
                
                playEpisode(1);
            } catch (err) {
                grid.innerHTML = `<div class="error">Failed to load episodes.</div>`;
            }
        }
        
        function playEpisode(ep) {
            currentEpisode = ep;
            document.querySelectorAll(".ep-btn").forEach(b => b.classList.toggle("active", parseInt(b.textContent) === ep));
            
            document.getElementById('player-loading').style.display = 'flex';
            const server = TV_SERVERS[currentServerIndex] || TV_SERVERS[0];
            document.getElementById('server-status').textContent = `✅ ${server.name} active`;
            document.getElementById("player").src = server.url({ tmdb: currentTmdbId, season: currentSeason, episode: ep, title: currentTitle });
        }

        async function loadDetails(tmdbId) {
            try {
                const response = await fetch(addAdultFilter(`${BASE}/tv/${tmdbId}?api_key=${API_KEY}`));
                const item = await response.json();
                if (isBlockedContent(item)) return blockContent();
                updateDocumentSeo(item);
                currentTitle = item.name || '';
                
                document.getElementById('movie-title').textContent = item.name;
                document.getElementById('movie-overview').textContent = item.overview || 'No description available.';
                document.getElementById('movie-rating').textContent = `⭐ ${item.vote_average?.toFixed(1) || 'N/A'}`;
                document.getElementById('movie-year').textContent = item.first_air_date?.slice(0, 4) || '';
                document.getElementById('movie-genre').textContent = item.genres?.map(g => g.name).join(', ') || '';
                
                if (item.episode_run_time && item.episode_run_time.length) {
                    document.getElementById('movie-runtime').textContent = `${item.episode_run_time[0]}m per ep`;
                }
                
                const castResponse = await fetch(addAdultFilter(`${BASE}/tv/${tmdbId}/credits?api_key=${API_KEY}`));
                const castData = await castResponse.json();
                const cast = (castData.cast || []).slice(0, 15);
                
                if (cast.length) {
                    document.getElementById('cast-section').style.display = 'block';
                    document.getElementById('cast-scroll').innerHTML = cast.map(c => {
                        const img = c.profile_path ? IMG + c.profile_path : '';
                        return `
                            <div class="cast-card">
                                ${img ? `<img src="${img}" loading="lazy">` : '<div style="width:120px;height:120px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center">🎭</div>'}
                                <div class="name">${c.name}</div>
                                <div class="char">${c.character || ''}</div>
                            </div>
                        `;
                    }).join('');
                }
            } catch(error) {
                console.error('Error loading details:', error);
            }
        }
    </script>
</body>
</html>
